; Two CYD hardware variants share one codebase:
;   pio run -e cyd       -t upload   -> original CYD, single micro-USB (ILI9341)
;   pio run -e cyd2usb   -t upload   -> "CYD2USB", micro-USB + USB-C (ST7789)
; If colors look inverted on your panel, add  -D DISPLAY_INVERT=1  to that env.

[platformio]
default_envs = cyd

[env]
; Pinned: Arduino-ESP32 core 2.x (the code uses the 2.x LEDC API)
platform = espressif32 @ ^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Automatically fetch required libraries
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.0.4
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    tzapu/WiFiManager @ ^2.0.17

; CYD-specific display configuration injected directly into TFT_eSPI
build_flags =
    -D USER_SETUP_LOADED=1
    -D USE_HSPI_PORT=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000

; Original ESP32-2432S028R — one micro-USB port, ILI9341 panel
[env:cyd]
build_flags =
    ${env.build_flags}
    -D ILI9341_2_DRIVER=1

; ESP32-2432S028R "CYD2USB" — micro-USB + USB-C ports, ST7789 panel
[env:cyd2usb]
build_flags =
    ${env.build_flags}
    -D ST7789_DRIVER=1
